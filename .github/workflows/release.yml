name: Release

# Trigger on any tag of the form vX.Y.Z
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # needed to create the GitHub Release
  id-token: write   # needed for PyPI OIDC Trusted Publisher auth

jobs:
  # ------------------------------------------------------------------ #
  #  1. Run the full test suite before we touch PyPI                    #
  # ------------------------------------------------------------------ #
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,webp]"

      - name: Unit tests
        run: pytest tests/ --ignore=tests/integration -q --tb=short

      - name: Integration tests
        run: pytest tests/integration/ -q --tb=short -m integration

  # ------------------------------------------------------------------ #
  #  2. Build the distribution                                          #
  # ------------------------------------------------------------------ #
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify the tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.3.1
          PKG=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print('v'+d['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PKG"
            exit 1
          fi

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------ #
  #  3. Publish to PyPI via OIDC Trusted Publisher (no token required)  #
  # ------------------------------------------------------------------ #
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/publishmd/

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — no PYPI_API_TOKEN secret needed.
        # Requires a Trusted Publisher configured on PyPI:
        #   Owner:      mateusmolina
        #   Repo:       publishmd
        #   Workflow:   release.yml
        #   Environment: pypi

  # ------------------------------------------------------------------ #
  #  4. Create a GitHub Release with auto-generated release notes       #
  # ------------------------------------------------------------------ #
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
