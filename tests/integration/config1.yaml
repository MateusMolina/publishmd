# Configuration for publishmd

# Optional: set default input/output directories relative to this config file.
# These can be overridden by --input-dir / --output-dir CLI flags.
input_dir: "example"
output_dir: "config1-output"

filters:
  # Frontmatter Filter - filters files based on YAML frontmatter
  - name: frontmatter_filter
    type: publishmd.filters.frontmatter_filter.FrontmatterFilter
    config:
      publish: true

  # Ignore Folder Filter - excludes files inside the listed folders
  # - name: ignorefolder_filter
  #   type: publishmd.filters.ignorefolder_filter.IgnoreFolderFilter
  #   config:
  #     ignored_folders:
  #       - drafts
  #       - private

emitters:
  # MD Emitter - copies markdown files with a configurable output extension.
  # Use output_extension: ".qmd" for Quarto output
  - name: md_emitter
    type: publishmd.emitters.md_emitter.MdEmitter
    config:
      output_extension: ".qmd"

  # Assets Emitter - finds and copies referenced assets
  - name: assets_emitter
    type: publishmd.emitters.assets_emitter.AssetsEmitter


transformers:
  # Wikilink Transformer - converts [[wikilinks]] to [standard](links)
  - name: wikilink_transformer
    type: publishmd.transformers.wikilink_transformer.WikilinkTransformer
    config:
      preserve_aliases: true
      link_extension: ".qmd"

  # Spaces to Dashes Transformer - renames files with spaces and updates links
  - name: spaces_to_dashes_transformer
    type: publishmd.transformers.spaces_to_dashes_transformer.SpacesToDashesTransformer

  # Stale Links Transformer - removes links to non-emitted files
  - name: stale_links_transformer
    type: publishmd.transformers.stale_links_transformer.StaleLinksTransformer
    config:
      remove_stale_links: true
      convert_to_text: true

  # Tags to Categories Transformer - converts frontmatter 'tags' to 'categories'
  - name: tags_to_categories_transformer
    type: publishmd.transformers.tags_to_categories_transformer.TagsToCategoriesTransformer

  # Rename Frontmatter Field Transformer - renames a frontmatter key
  # Multiple instances handle different renames independently.
  - name: rename_modified
    type: publishmd.transformers.rename_frontmatter_field_transformer.RenameFrontmatterFieldTransformer
    config:
      from_field: modified
      to_field: date-modified

  - name: rename_created
    type: publishmd.transformers.rename_frontmatter_field_transformer.RenameFrontmatterFieldTransformer
    config:
      from_field: created
      to_field: date
